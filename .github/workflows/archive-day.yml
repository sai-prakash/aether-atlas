# Commits closed days from the public index. No PAT. GITHUB_TOKEN is enough.
# Vercel cron at 06:15 UTC closes the day; this runs 30 minutes later — and
# also backfills any closed day the repo is missing (late pulse, not zeros).
name: archive-day
on:
  schedule:
    - cron: "45 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull closed snapshots
        env:
          DESK: https://aether-atlas-eight.vercel.app
        run: |
          set -euo pipefail
          mkdir -p data/days
          curl -sS -o /tmp/index.json "$DESK/api/day.json"
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          desk = os.environ["DESK"]
          idx = json.load(open("/tmp/index.json"))
          days = [row["day"] for row in idx.get("days") or []]
          if not days:
              print("index empty — leaving holes, not zeros")
              raise SystemExit(0)
          wrote = []
          for day in days:
              dest = f"data/days/{day}.json"
              url = f"{desk}/api/day.json?d={day}"
              req = urllib.request.Request(url)
              try:
                  with urllib.request.urlopen(req, timeout=30) as res:
                      raw = res.read().decode()
              except Exception as e:
                  print(f"{day} skip ({e}) — hole, not zeros")
                  continue
              json.loads(raw)
              if not raw.endswith("\n"):
                  raw += "\n"
              open(dest, "w").write(raw)
              wrote.append(dest)
              print(f"wrote {dest}")
          open("/tmp/wrote.txt", "w").write("\n".join(wrote))
          PY
          git config user.name "Ira Prior"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/days
          if git diff --cached --quiet; then
            echo "unchanged"
            exit 0
          fi
          git commit -m "data: closed days"
          git push
